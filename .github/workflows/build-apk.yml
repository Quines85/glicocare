name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter clean

      - run: flutter pub get

      - run: flutter pub run build_runner build --delete-conflicting-outputs

      - run: flutter analyze

      - run: flutter test

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: glicocare-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Publicar Release com o APK
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: GlicoCare build ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk

      - name: Documentar download do APK
        if: github.ref == 'refs/heads/main'
        run: |
          echo "=== Como baixar o APK ==="
          echo "Opcao A: Aba Actions > executando run > Artifacts > glicocare-apk"
          echo "Opcao B: aba Releases > ultimo build > app-release.apk"
          echo "Instalacao: permitir 'instalar apps de fontes desconhecidas' no celular"